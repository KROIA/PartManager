<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="620" fill="#f5f6f8"/>
  <rect x="0" y="0" width="1000" height="28" fill="#2f6fed"/>
  <text x="12" y="19" font-size="12" fill="#ffffff">PartManager — New Part (manual)</text>
  <rect x="0" y="28" width="1000" height="26" fill="#e3e8ef"/>
  <text x="20" y="46" font-size="12" font-weight="bold" fill="#2f6fed">Home</text>
  <rect x="15" y="52" width="45" height="2" fill="#2f6fed"/>
  <text x="90" y="46" font-size="12" fill="#57606a">Parts</text>
  <text x="150" y="46" font-size="12" fill="#57606a">Partlists</text>
  <text x="230" y="46" font-size="12" fill="#57606a">Orders</text>
  <text x="300" y="46" font-size="12" fill="#57606a">KiCad</text>
  <rect x="0" y="54" width="1000" height="70" fill="#f0f3f7" stroke="#d7dbe0"/>
  <rect x="12" y="62" width="130" height="54" rx="4" fill="#ffffff" stroke="#d7dbe0"/>
  <text x="20" y="82" font-size="10" fill="#24292f">New Part</text>
  <text x="20" y="98" font-size="10" fill="#24292f">New Partlist</text>
  <text x="77" y="112" font-size="9" fill="#8a929c" text-anchor="middle">New</text>

  <rect x="16" y="140" width="968" height="440" fill="#ffffff" stroke="#d7dbe0" rx="6"/>
  <text x="32" y="164" font-size="14" font-weight="bold" fill="#24292f">New Part</text>
  <text x="32" y="182" font-size="10" fill="#8a929c">Blank form — for the Mouser-assisted path see "New Part (from Mouser link)" instead.</text>
  <text x="800" y="164" font-size="9" fill="#8a929c" text-anchor="end">* required — form generated from the</text>
  <text x="800" y="178" font-size="9" fill="#8a929c" text-anchor="end">selected type's template</text>

  <text x="32" y="206" font-size="10" fill="#8a929c">Component type</text>
  <rect x="150" y="194" width="200" height="20" rx="3" fill="#f0f3f7" stroke="#d7dbe0"/>
  <text x="158" y="208" font-size="10" fill="#24292f">Resistor ▾</text>

  <line x1="32" y1="222" x2="952" y2="222" stroke="#eceef1"/>

  <g font-size="10" fill="#24292f">
    <text x="32" y="248">Name *</text><rect x="150" y="236" width="300" height="18" fill="#ffffff" stroke="#e8a33d"/>
    <text x="32" y="272">Manufacturer</text><rect x="150" y="260" width="300" height="18" fill="#ffffff" stroke="#d7dbe0"/>
    <text x="32" y="296">MPN</text><rect x="150" y="284" width="300" height="18" fill="#ffffff" stroke="#d7dbe0"/>
    <text x="32" y="320">Package</text><rect x="150" y="308" width="300" height="18" fill="#ffffff" stroke="#d7dbe0"/>
  </g>

  <line x1="32" y1="336" x2="952" y2="336" stroke="#eceef1"/>
  <text x="32" y="356" font-size="10" font-weight="bold" fill="#57606a">TYPE ATTRIBUTES</text>

  <g font-size="10" fill="#24292f">
    <text x="32" y="380">Resistance (Ω) *</text><rect x="180" y="368" width="120" height="18" fill="#ffffff" stroke="#e8a33d"/>
    <circle cx="312" cy="377" r="7" fill="#eef2f7" stroke="#8a929c"/><text x="312" y="381" font-size="9" text-anchor="middle" fill="#57606a">i</text>

    <text x="32" y="404">Tolerance (%)</text><rect x="180" y="392" width="120" height="18" fill="#ffffff" stroke="#d7dbe0"/>
    <circle cx="312" cy="401" r="7" fill="#eef2f7" stroke="#8a929c"/><text x="312" y="405" font-size="9" text-anchor="middle" fill="#57606a">i</text>

    <text x="32" y="428">Power (W)</text><rect x="180" y="416" width="120" height="18" fill="#ffffff" stroke="#d7dbe0"/>
    <circle cx="312" cy="425" r="7" fill="#eef2f7" stroke="#8a929c"/><text x="312" y="429" font-size="9" text-anchor="middle" fill="#57606a">i</text>
  </g>

  <!-- tooltip bubble illustration -->
  <rect x="330" y="362" width="300" height="34" rx="4" fill="#24292f"/>
  <text x="340" y="376" font-size="9" fill="#ffffff">Nominal resistance value printed on the part /</text>
  <text x="340" y="390" font-size="9" fill="#ffffff">datasheet. "4k7" and "4700" store the same value.</text>

  <line x1="670" y1="336" x2="670" y2="450" stroke="#eceef1"/>
  <text x="690" y="356" font-size="10" font-weight="bold" fill="#57606a">FILES</text>
  <text x="690" y="378" font-size="10" fill="#24292f">Datasheet</text><text x="850" y="378" font-size="9" fill="#8a929c">optional</text>
  <rect x="690" y="386" width="260" height="26" rx="3" fill="#f0f3f7" stroke="#d7dbe0" stroke-dasharray="3,2"/>
  <text x="820" y="403" font-size="9" fill="#8a929c" text-anchor="middle">drop file or browse...</text>

  <text x="690" y="430" font-size="10" fill="#24292f">3D Model</text><text x="850" y="430" font-size="9" fill="#8a929c">optional</text>
  <rect x="690" y="438" width="260" height="26" rx="3" fill="#f0f3f7" stroke="#d7dbe0" stroke-dasharray="3,2"/>
  <text x="820" y="455" font-size="9" fill="#8a929c" text-anchor="middle">drop file or browse...</text>

  <text x="32" y="558" font-size="9" fill="#8a929c">Fields/files marked * must be filled before "Create Part" is enabled — everything else stays optional and editable later.</text>

  <rect x="32" y="540" width="130" height="28" rx="4" fill="#2f6fed"/>
  <text x="97" y="558" font-size="11" fill="#ffffff" text-anchor="middle">Create Part</text>
  <rect x="172" y="540" width="90" height="28" rx="4" fill="#eef2f7" stroke="#d7dbe0"/>
  <text x="217" y="558" font-size="11" fill="#24292f" text-anchor="middle">Cancel</text>
</svg>

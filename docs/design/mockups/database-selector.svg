<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="600" fill="#f5f6f8"/>
  <rect x="0" y="0" width="1000" height="70" fill="#2f6fed"/>
  <text x="32" y="34" font-size="18" font-weight="bold" fill="#ffffff">PartManager</text>
  <text x="32" y="54" font-size="11" fill="#dbe6ff">Select a database to open — you can switch anytime from the right-click menu</text>

  <rect x="32" y="94" width="936" height="410" fill="#ffffff" stroke="#d7dbe0" rx="6"/>

  <!-- row: currently open -->
  <rect x="32" y="94" width="936" height="70" fill="#eef4ff" rx="6"/>
  <text x="52" y="118" font-size="13" font-weight="bold" fill="#24292f">HomeLab</text>
  <rect x="150" y="106" width="70" height="16" rx="8" fill="#dbf5e3"/><text x="185" y="118" font-size="9" text-anchor="middle" fill="#186a3a">v7 ✓ current</text>
  <text x="890" y="118" font-size="9" fill="#2f6fed" text-anchor="end">● currently open</text>
  <text x="52" y="136" font-size="10" fill="#57606a">My personal hobby parts stock — resistors, caps, dev boards.</text>
  <text x="52" y="152" font-size="9" fill="#8a929c">E:\PartManagerDatabases\HomeLab\HomeLab.pmdb · last opened today</text>
  <text x="900" y="136" font-size="9" fill="#2f6fed" text-anchor="end">🖉 Edit description</text>
  <text x="900" y="150" font-size="9" fill="#8a929c" text-anchor="end">Remove from list</text>

  <line x1="32" y1="164" x2="968" y2="164" stroke="#eceef1"/>

  <!-- row: other company -->
  <rect x="32" y="164" width="936" height="70" fill="#ffffff"/>
  <text x="52" y="188" font-size="13" font-weight="bold" fill="#24292f">MyCompanyA</text>
  <rect x="170" y="176" width="70" height="16" rx="8" fill="#dbf5e3"/><text x="205" y="188" font-size="9" text-anchor="middle" fill="#186a3a">v7 ✓ current</text>
  <text x="52" y="206" font-size="10" fill="#57606a">Company A stock — separate wallet, separate parts, kept fully apart from HomeLab.</text>
  <text x="52" y="222" font-size="9" fill="#8a929c">D:\Shared\PartManagerDatabases\MyCompanyA\MyCompanyA.pmdb · last opened 2026-08-20</text>
  <text x="900" y="206" font-size="9" fill="#2f6fed" text-anchor="end">🖉 Edit description</text>
  <text x="900" y="220" font-size="9" fill="#8a929c" text-anchor="end">Remove from list</text>

  <line x1="32" y1="234" x2="968" y2="234" stroke="#eceef1"/>

  <!-- row: needs migration -->
  <rect x="32" y="234" width="936" height="70" fill="#ffffff"/>
  <text x="52" y="258" font-size="13" font-weight="bold" fill="#24292f">OldProject</text>
  <rect x="170" y="246" width="120" height="16" rx="8" fill="#fdeadb"/><text x="230" y="258" font-size="9" text-anchor="middle" fill="#8a4b00">v5 ⚠ needs update</text>
  <text x="52" y="276" font-size="10" fill="#57606a">Archived — resistors/caps from a 2025 project.</text>
  <text x="52" y="292" font-size="9" fill="#8a929c">E:\Archive\OldProject\OldProject.pmdb · last opened 2026-01-04</text>
  <text x="52" y="304" font-size="9" fill="#8a4b00">Opening will back up the database, then migrate schema v5 → v7 automatically.</text>
  <text x="900" y="276" font-size="9" fill="#2f6fed" text-anchor="end">🖉 Edit description</text>
  <text x="900" y="290" font-size="9" fill="#8a929c" text-anchor="end">Remove from list</text>

  <line x1="32" y1="304" x2="968" y2="304" stroke="#eceef1"/>
  <text x="52" y="330" font-size="9" fill="#8a929c">A database whose schema is *newer* than this copy of PartManager cannot be listed as openable —</text>
  <text x="52" y="344" font-size="9" fill="#8a929c">it would show "✗ too new — update PartManager" instead, and "Open" would stay disabled for that row.</text>

  <rect x="32" y="524" width="180" height="30" rx="4" fill="#2f6fed"/>
  <text x="122" y="543" font-size="11" fill="#ffffff" text-anchor="middle">Open "HomeLab"</text>
  <rect x="222" y="524" width="180" height="30" rx="4" fill="#eef2f7" stroke="#d7dbe0"/>
  <text x="312" y="543" font-size="11" fill="#24292f" text-anchor="middle">Browse for existing...</text>
  <rect x="412" y="524" width="150" height="30" rx="4" fill="#eef2f7" stroke="#d7dbe0"/>
  <text x="487" y="543" font-size="11" fill="#24292f" text-anchor="middle">New Database...</text>
  <text x="600" y="543" font-size="9" fill="#8a929c">"Browse..." opens a file picker filtered to *.pmdb \u2014 pick the entry file inside the folder you want to import.</text>
</svg>

  <text x="255" y="112" font-size="9" fill="#8a929c" text-anchor="middle">Checkout</text>

  <rect x="16" y="140" width="968" height="50" fill="#ffffff" stroke="#d7dbe0" rx="6"/>
  <text x="30" y="160" font-size="10" fill="#8a929c">Name</text><rect x="70" y="150" width="180" height="18" fill="#f0f3f7" stroke="#d7dbe0"/><text x="76" y="163" font-size="10">PSU Rev C</text>
  <text x="270" y="160" font-size="10" fill="#8a929c">Project link</text><rect x="330" y="150" width="260" height="18" fill="#f0f3f7" stroke="#d7dbe0"/><text x="336" y="163" font-size="10">github.com/alex/psu-revc</text>
  <text x="610" y="160" font-size="10" fill="#8a929c">Multiplier (PCB count)</text><rect x="740" y="150" width="40" height="18" fill="#f0f3f7" stroke="#d7dbe0"/><text x="754" y="163" font-size="10">5</text>

  <rect x="16" y="200" width="968" height="300" fill="#ffffff" stroke="#d7dbe0" rx="6"/>

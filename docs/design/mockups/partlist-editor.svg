    <text x="470" y="294">1</text><text x="560" y="294">5</text><text x="700" y="294">—</text><text x="800" y="294">—</text>

    <rect x="24" y="302" width="952" height="24" fill="#fbfcfd"/>
    <text x="32" y="318">L1</text><text x="200" y="318">IND-1210-10uH</text><text x="470" y="318">1</text><text x="560" y="318">5</text><text x="700" y="318">2</text>
    <text x="800" y="318" fill="#8a4b00">3</text>
  </g>

  <text x="32" y="470" font-size="9" fill="#8a929c">Rows in orange are unresolved imports (raw_import_data kept) or below the needed quantity — "Check Stock" pushes shortfall rows into a draft order.</text>

  <rect x="16" y="520" width="968" height="60" fill="#ffffff" stroke="#d7dbe0" rx="6"/>
  <rect x="32" y="536" width="130" height="28" rx="4" fill="#2f6fed"/>

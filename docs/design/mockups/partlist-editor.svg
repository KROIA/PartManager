  <text x="32" y="222" font-size="10" font-weight="bold" fill="#57606a">Designators</text>
  <text x="200" y="222" font-size="10" font-weight="bold" fill="#57606a">Part</text>
  <text x="470" y="222" font-size="10" font-weight="bold" fill="#57606a">Qty/unit</text>
  <text x="560" y="222" font-size="10" font-weight="bold" fill="#57606a">Qty total (×5)</text>
  <text x="700" y="222" font-size="10" font-weight="bold" fill="#57606a">In stock</text>
  <text x="800" y="222" font-size="10" font-weight="bold" fill="#57606a">Shortfall</text>

  <g font-size="10" fill="#24292f">
    <text x="32" y="246">R1,R2,R5</text><text x="200" y="246">RES-0603-4K7</text><text x="470" y="246">3</text><text x="560" y="246">15</text><text x="700" y="246">12</text>
    <text x="800" y="246" fill="#8a4b00">3</text>

    <rect x="24" y="254" width="952" height="24" fill="#fbfcfd"/>
    <text x="32" y="270">C1,C2</text><text x="200" y="270">CAP-0805-100n</text><text x="470" y="270">2</text><text x="560" y="270">10</text><text x="700" y="270">45</text>
    <text x="800" y="270" fill="#3aa76d">0</text>

    <text x="32" y="294">U1</text>
    <rect x="200" y="282" width="220" height="16" rx="3" fill="#fdf6e3" stroke="#e8a33d"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="520" fill="#f5f6f8"/>
  <rect x="0" y="0" width="1000" height="28" fill="#2f6fed"/>
  <text x="12" y="19" font-size="12" fill="#ffffff">PartManager — KiCad</text>
  <rect x="0" y="28" width="1000" height="26" fill="#e3e8ef"/>
  <text x="20" y="46" font-size="12" fill="#57606a">Home</text>
  <text x="90" y="46" font-size="12" fill="#57606a">Parts</text>
  <text x="150" y="46" font-size="12" fill="#57606a">Partlists</text>
  <text x="230" y="46" font-size="12" fill="#57606a">Orders</text>
  <text x="300" y="46" font-size="12" font-weight="bold" fill="#2f6fed">KiCad</text>
  <rect x="295" y="52" width="45" height="2" fill="#2f6fed"/>
  <rect x="0" y="54" width="1000" height="70" fill="#f0f3f7" stroke="#d7dbe0"/>
  <rect x="12" y="62" width="150" height="54" rx="4" fill="#ffffff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="20" y="82" font-size="10" font-weight="bold" fill="#2f6fed">Rebuild Libraries</text>
  <text x="20" y="98" font-size="10" fill="#24292f">Open Library Folder</text>
  <text x="87" y="112" font-size="9" fill="#8a929c" text-anchor="middle">Library</text>
  <rect x="170" y="62" width="150" height="54" rx="4" fill="#ffffff" stroke="#d7dbe0"/>
  <text x="178" y="82" font-size="10" fill="#24292f">Install/Update Plugin</text>
  <text x="245" y="112" font-size="9" fill="#8a929c" text-anchor="middle">Plugin</text>

  <!-- left: library status -->
  <rect x="16" y="140" width="470" height="360" fill="#ffffff" stroke="#d7dbe0" rx="6"/>
  <text x="32" y="162" font-size="12" font-weight="bold" fill="#24292f">Generated KiCad Libraries</text>
  <text x="32" y="180" font-size="9" fill="#8a929c">kicad_libs/ — one .kicad_sym + .pretty per category</text>

  <g font-size="10" fill="#24292f">
    <text x="32" y="206">Resistors</text><text x="500-140" y="206"></text><text x="380" y="206" fill="#3aa76d">✓ up to date</text><text x="460" y="206" fill="#8a929c">412 parts</text>
    <text x="32" y="228">Capacitors</text><text x="380" y="228" fill="#3aa76d">✓ up to date</text><text x="460" y="228" fill="#8a929c">188 parts</text>
    <text x="32" y="250">Inductors</text><text x="380" y="250" fill="#3aa76d">✓ up to date</text><text x="460" y="250" fill="#8a929c">34 parts</text>
    <text x="32" y="272">Power Regulators</text><text x="380" y="272" fill="#e8a33d">⚠ needs rebuild</text><text x="460" y="272" fill="#8a929c">21 parts</text>
    <text x="32" y="294">MOSFETs / Transistors</text><text x="380" y="294" fill="#3aa76d">✓ up to date</text><text x="460" y="294" fill="#8a929c">46 parts</text>
  </g>

  <rect x="32" y="316" width="130" height="26" rx="4" fill="#2f6fed"/>
  <text x="97" y="333" font-size="10" fill="#ffffff" text-anchor="middle">Rebuild All</text>
  <rect x="172" y="316" width="150" height="26" rx="4" fill="#eef2f7" stroke="#d7dbe0"/>
  <text x="247" y="333" font-size="10" fill="#24292f" text-anchor="middle">Rebuild Selected</text>

  <line x1="32" y1="358" x2="454" y2="358" stroke="#eceef1"/>
  <text x="32" y="380" font-size="10" fill="#8a929c">One-time setup: add this table as a library entry in KiCad</text>
  <rect x="32" y="390" width="422" height="20" fill="#f0f3f7" stroke="#d7dbe0"/>
  <text x="38" y="404" font-size="9" fill="#24292f">${PARTMANAGER_LIBS}/partmanager-sym-lib-table</text>
  <text x="32" y="428" font-size="9" fill="#2f6fed">Copy path</text>

  <!-- right: plugin status -->
  <rect x="502" y="140" width="482" height="360" fill="#ffffff" stroke="#d7dbe0" rx="6"/>
  <text x="518" y="162" font-size="12" font-weight="bold" fill="#24292f">PCB IPC Plugin</text>
  <text x="518" y="182" font-size="10" fill="#24292f">KiCad detected: v10.0.5</text>
  <text x="518" y="200" font-size="10" fill="#3aa76d">Plugin installed — v0.3.0, up to date</text>
  <rect x="518" y="216" width="130" height="26" rx="4" fill="#eef2f7" stroke="#d7dbe0"/>
  <text x="583" y="233" font-size="10" fill="#24292f" text-anchor="middle">Reinstall / Update</text>

  <line x1="518" y1="256" x2="966" y2="256" stroke="#eceef1"/>
  <text x="518" y="278" font-size="10" font-weight="bold" fill="#57606a">Scope (KiCad 10)</text>
  <text x="518" y="298" font-size="9" fill="#8a929c">✓ PCB-side: footprint/3D-model verification, BOM pull from board.</text>
  <text x="518" y="314" font-size="9" fill="#8a929c">✗ Schematic placement: not exposed by KiCad's official API yet —</text>
  <text x="518" y="330" font-size="9" fill="#8a929c">   parts are placed via the generated library (Parts tab), not this plugin.</text>
</svg>

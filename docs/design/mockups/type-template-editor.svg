<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="780" fill="#f5f6f8"/>
  <rect x="0" y="0" width="1000" height="28" fill="#2f6fed"/>
  <text x="12" y="19" font-size="12" fill="#ffffff">PartManager — Type Templates</text>
  <text x="980" y="19" font-size="13" fill="#ffffff" text-anchor="end">⚙</text>
  <rect x="0" y="28" width="1000" height="26" fill="#e3e8ef"/>
  <text x="20" y="46" font-size="12" fill="#57606a">Home</text>
  <text x="90" y="46" font-size="12" font-weight="bold" fill="#2f6fed">Parts</text>
  <rect x="85" y="52" width="45" height="2" fill="#2f6fed"/>
  <text x="150" y="46" font-size="12" fill="#57606a">Partlists</text>
  <text x="230" y="46" font-size="12" fill="#57606a">Orders</text>
  <text x="300" y="46" font-size="12" fill="#57606a">KiCad</text>
  <rect x="0" y="54" width="1000" height="70" fill="#f0f3f7" stroke="#d7dbe0"/>
  <rect x="12" y="62" width="150" height="54" rx="4" fill="#ffffff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="30" y="82" font-size="10" font-weight="bold" fill="#2f6fed">Edit Type Templates ◂ (here)</text>
  <text x="30" y="98" font-size="10" fill="#24292f">Import from Mouser</text>
  <text x="87" y="112" font-size="9" fill="#8a929c" text-anchor="middle">Manage</text>

  <!-- left: type list -->
  <rect x="16" y="140" width="240" height="620" fill="#ffffff" stroke="#d7dbe0" rx="6"/>
  <text x="30" y="162" font-size="11" font-weight="bold" fill="#57606a">TYPES</text>
  <rect x="24" y="172" width="216" height="20" fill="#eef4ff"/>
  <text x="32" y="186" font-size="11" fill="#2f6fed">● Resistor</text>
  <text x="32" y="210" font-size="11" fill="#24292f">Capacitor</text>
  <text x="32" y="234" font-size="11" fill="#24292f">Inductor</text>
  <text x="32" y="258" font-size="11" fill="#24292f">Power Regulator</text>
  <text x="32" y="282" font-size="11" fill="#24292f">MOSFET</text>
  <text x="32" y="306" font-size="11" fill="#24292f">Transistor</text>
  <text x="32" y="330" font-size="11" fill="#24292f">Screw</text>
  <text x="32" y="354" font-size="11" fill="#24292f">Wood Sheet</text>
  <text x="30" y="384" font-size="10" fill="#2f6fed">+ New Type</text>

  <!-- right: attribute + file-slot editor -->
  <rect x="268" y="140" width="716" height="620" fill="#ffffff" stroke="#d7dbe0" rx="6"/>
  <text x="284" y="162" font-size="13" font-weight="bold" fill="#24292f">Resistor</text>
  <text x="284" y="180" font-size="10" fill="#8a929c">domain: electronic · KiCad category: "Resistors" · used by 412 parts</text>

  <text x="284" y="204" font-size="11" font-weight="bold" fill="#57606a">ATTRIBUTES</text>
  <rect x="284" y="212" width="684" height="20" fill="#f0f3f7"/>
  <text x="292" y="226" font-size="9" font-weight="bold" fill="#57606a">Req.</text>
  <text x="326" y="226" font-size="9" font-weight="bold" fill="#57606a">Key</text>
  <text x="410" y="226" font-size="9" font-weight="bold" fill="#57606a">Label</text>
  <text x="510" y="226" font-size="9" font-weight="bold" fill="#57606a">Unit</text>
  <text x="555" y="226" font-size="9" font-weight="bold" fill="#57606a">Datatype</text>
  <text x="640" y="226" font-size="9" font-weight="bold" fill="#57606a">Search</text>
  <text x="700" y="226" font-size="9" font-weight="bold" fill="#57606a">List</text>
  <text x="740" y="226" font-size="9" font-weight="bold" fill="#57606a">Order</text>

  <g font-size="10" fill="#24292f">
    <rect x="284" y="234" width="684" height="24" fill="#eef4ff"/>
    <rect x="294" y="240" width="12" height="12" fill="#2f6fed"/>
    <text x="326" y="250">resistance</text><text x="410" y="250">Resistance</text>
    <rect x="505" y="240" width="42" height="14" rx="2" fill="#ffffff" stroke="#d7dbe0"/><text x="510" y="250" font-size="9">Ω ▾</text>
    <text x="555" y="250">dimension</text>
    <rect x="640" y="240" width="12" height="12" fill="#2f6fed"/><rect x="700" y="240" width="12" height="12" fill="#2f6fed"/>
    <text x="740" y="250">↕ 1</text>

    <rect x="294" y="264" width="12" height="12" fill="#ffffff" stroke="#d7dbe0"/>
    <text x="326" y="274">tolerance</text><text x="410" y="274">Tolerance</text>
    <rect x="505" y="264" width="42" height="14" rx="2" fill="#ffffff" stroke="#d7dbe0"/><text x="510" y="274" font-size="9">% ▾</text>
    <text x="555" y="274">number</text>
    <rect x="640" y="264" width="12" height="12" fill="#ffffff" stroke="#d7dbe0"/><rect x="700" y="264" width="12" height="12" fill="#2f6fed"/>
    <text x="740" y="274">↕ 2</text>

    <rect x="284" y="282" width="684" height="24" fill="#fbfcfd"/>
    <rect x="294" y="288" width="12" height="12" fill="#ffffff" stroke="#d7dbe0"/>
    <text x="326" y="298">power</text><text x="410" y="298">Power</text>
    <rect x="505" y="288" width="42" height="14" rx="2" fill="#ffffff" stroke="#d7dbe0"/><text x="510" y="298" font-size="9">W ▾</text>
    <text x="555" y="298">dimension</text>
    <rect x="640" y="288" width="12" height="12" fill="#ffffff" stroke="#d7dbe0"/><rect x="700" y="288" width="12" height="12" fill="#ffffff" stroke="#d7dbe0"/>
    <text x="740" y="298">↕ 3</text>
  </g>
  <text x="284" y="326" font-size="10" fill="#2f6fed">+ Add attribute</text>

  <line x1="284" y1="342" x2="968" y2="342" stroke="#eceef1"/>
  <text x="284" y="362" font-size="10" font-weight="bold" fill="#57606a">Tooltip for selected attribute — "resistance" (shown as an ⓘ hint on the New Part screen)</text>
  <rect x="284" y="370" width="684" height="52" rx="4" fill="#f0f3f7" stroke="#d7dbe0"/>
  <text x="292" y="386" font-size="10" fill="#24292f">Nominal resistance value printed on the part / datasheet.</text>
  <text x="292" y="402" font-size="10" fill="#24292f">Enter with a unit if you like, e.g. "4k7" or "4700" — both are stored the same way.</text>

  <line x1="284" y1="436" x2="968" y2="436" stroke="#eceef1"/>
  <text x="284" y="458" font-size="11" font-weight="bold" fill="#57606a">FILE SLOTS</text>
  <rect x="284" y="466" width="684" height="20" fill="#f0f3f7"/>
  <text x="292" y="480" font-size="9" font-weight="bold" fill="#57606a">Req.</text>
  <text x="326" y="480" font-size="9" font-weight="bold" fill="#57606a">Role</text>
  <text x="460" y="480" font-size="9" font-weight="bold" fill="#57606a">Label</text>
  <text x="700" y="480" font-size="9" font-weight="bold" fill="#57606a">Order</text>

  <g font-size="10" fill="#24292f">
    <rect x="294" y="492" width="12" height="12" fill="#ffffff" stroke="#d7dbe0"/>
    <text x="326" y="502">datasheet</text><text x="460" y="502">Datasheet</text><text x="700" y="502">↕ 1</text>

    <rect x="284" y="510" width="684" height="24" fill="#fbfcfd"/>
    <rect x="294" y="516" width="12" height="12" fill="#ffffff" stroke="#d7dbe0"/>
    <text x="326" y="526">kicad_3dmodel</text><text x="460" y="526">3D Model</text><text x="700" y="526">↕ 2</text>
  </g>
  <text x="284" y="556" font-size="10" fill="#2f6fed">+ Add file slot</text>
  <text x="284" y="576" font-size="9" fill="#8a929c">Example of a type that DOES require a file: "Screw" → file slot "CAD Model" checked Required.</text>

  <rect x="284" y="700" width="90" height="26" rx="4" fill="#2f6fed"/>
  <text x="329" y="717" font-size="11" fill="#ffffff" text-anchor="middle">Done</text>
  <rect x="384" y="700" width="120" height="26" rx="4" fill="#eef2f7" stroke="#d7dbe0"/>
  <text x="444" y="717" font-size="11" fill="#24292f" text-anchor="middle">Discard changes</text>
  <text x="524" y="717" font-size="9" fill="#8a929c">(everything here already autosaves — this just leaves the editor)</text>
</svg>

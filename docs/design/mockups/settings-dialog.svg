<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="600" fill="#f5f6f8"/>
  <rect x="0" y="0" width="900" height="600" fill="#1c1f24" opacity="0.12"/>

  <!-- context menu entry point illustration -->
  <circle cx="70" cy="40" r="3" fill="#24292f"/>
  <text x="80" y="44" font-size="9" fill="#57606a">right-click anywhere on the main window</text>
  <rect x="20" y="52" width="210" height="152" rx="4" fill="#ffffff" stroke="#c9ccd1"/>
  <text x="34" y="72" font-size="11" fill="#24292f">Settings...</text>
  <text x="34" y="94" font-size="11" fill="#24292f">Rebuild KiCad Libraries</text>
  <line x1="30" y1="104" x2="220" y2="104" stroke="#eceef1"/>
  <text x="34" y="122" font-size="11" fill="#24292f">Switch Database ▸</text>
  <text x="34" y="144" font-size="11" fill="#24292f">Manage Databases...</text>
  <line x1="30" y1="154" x2="220" y2="154" stroke="#eceef1"/>
  <text x="34" y="172" font-size="11" fill="#24292f">About PartManager</text>

  <!-- settings dialog -->
  <rect x="220" y="90" width="580" height="440" rx="8" fill="#ffffff" stroke="#c9ccd1"/>
  <rect x="220" y="90" width="580" height="34" rx="8" fill="#f0f3f7"/>
  <text x="236" y="112" font-size="12" font-weight="bold" fill="#24292f">Settings</text>
  <text x="780" y="112" font-size="13" fill="#8a929c" text-anchor="end">✕</text>

  <!-- left nav -->
  <rect x="220" y="124" width="150" height="406" fill="#fbfcfd" stroke="#eceef1"/>
  <rect x="220" y="134" width="150" height="26" fill="#e6efff"/>
  <text x="236" y="152" font-size="11" fill="#2f6fed">General</text>
  <text x="236" y="182" font-size="11" fill="#24292f">Appearance</text>
  <text x="236" y="212" font-size="11" fill="#24292f">Storage</text>
  <text x="236" y="242" font-size="11" fill="#24292f">Mouser</text>
  <text x="236" y="272" font-size="11" fill="#24292f">KiCad</text>

  <!-- right content: General -->
  <text x="392" y="152" font-size="11" font-weight="bold" fill="#57606a">LANGUAGE</text>
  <circle cx="398" cy="172" r="5" fill="#2f6fed"/><text x="410" y="176" font-size="11" fill="#24292f">English</text>
  <circle cx="398" cy="194" r="5" fill="none" stroke="#8a929c"/><text x="410" y="198" font-size="11" fill="#24292f">Deutsch</text>

  <line x1="392" y1="214" x2="784" y2="214" stroke="#eceef1"/>
  <text x="392" y="236" font-size="11" font-weight="bold" fill="#57606a">DEFAULTS</text>
  <text x="392" y="258" font-size="11" fill="#24292f">Default currency</text>
  <rect x="540" y="246" width="80" height="18" rx="3" fill="#f0f3f7" stroke="#d7dbe0"/>
  <text x="548" y="259" font-size="10" fill="#24292f">EUR ▾</text>

  <line x1="392" y1="278" x2="784" y2="278" stroke="#eceef1"/>
  <text x="392" y="300" font-size="9" fill="#8a929c">Appearance tab preview:</text>
  <rect x="392" y="308" width="180" height="60" rx="4" fill="#24292f" stroke="#000"/>
  <text x="402" y="326" font-size="9" fill="#dbe6ff">Dark theme</text>
  <text x="402" y="342" font-size="8" fill="#8a929c">Light / Dark / Follow system —</text>
  <text x="402" y="354" font-size="8" fill="#8a929c">applies live, no restart needed</text>

  <text x="392" y="500" font-size="9" fill="#8a929c">Every change here applies immediately and autosaves — there is no separate "Save" step for Settings either.</text>
  <rect x="694" y="500" width="86" height="22" rx="4" fill="#eef2f7" stroke="#d7dbe0"/>
  <text x="737" y="515" font-size="10" fill="#24292f" text-anchor="middle">Close</text>
</svg>

  <g font-size="10" fill="#24292f">
    <rect x="32" y="198" width="936" height="24" fill="#eef4ff"/>
    <text x="40" y="214">2026-014</text><text x="140" y="214">PSU Rev C ×5</text>
    <rect x="320" y="203" width="90" height="14" rx="7" fill="#fdeadb"/><text x="365" y="213" font-size="9" text-anchor="middle" fill="#8a4b00">staged_in_cart</text>
    <text x="440" y="214">4</text><text x="500" y="214">3.51€</text><text x="580" y="214">2026-08-30</text><text x="700" y="214">—</text>

    <text x="40" y="238">2026-009</text><text x="140" y="238">LED Driver v2</text>

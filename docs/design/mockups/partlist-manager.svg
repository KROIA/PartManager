<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="520" fill="#f5f6f8"/>
  <rect x="0" y="0" width="1000" height="28" fill="#2f6fed"/>
  <text x="12" y="19" font-size="12" fill="#ffffff">PartManager — Partlists</text>
  <rect x="0" y="28" width="1000" height="26" fill="#e3e8ef"/>
  <text x="20" y="46" font-size="12" fill="#57606a">Home</text>
  <text x="90" y="46" font-size="12" fill="#57606a">Parts</text>
  <text x="150" y="46" font-size="12" font-weight="bold" fill="#2f6fed">Partlists</text>
  <rect x="145" y="52" width="70" height="2" fill="#2f6fed"/>
  <text x="230" y="46" font-size="12" fill="#57606a">Orders</text>
  <text x="300" y="46" font-size="12" fill="#57606a">KiCad</text>
  <rect x="0" y="54" width="1000" height="70" fill="#f0f3f7" stroke="#d7dbe0"/>
  <rect x="12" y="62" width="160" height="54" rx="4" fill="#ffffff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="20" y="82" font-size="10" font-weight="bold" fill="#2f6fed">New Partlist</text>
  <text x="20" y="98" font-size="10" fill="#24292f">Import CSV/BOM</text>
  <text x="92" y="112" font-size="9" fill="#8a929c" text-anchor="middle">Build</text>

  <rect x="16" y="140" width="968" height="360" fill="#ffffff" stroke="#d7dbe0" rx="6"/>
  <text x="32" y="162" font-size="11" font-weight="bold" fill="#57606a">ALL PARTLISTS</text>
  <rect x="600" y="150" width="150" height="18" rx="3" fill="#f0f3f7" stroke="#d7dbe0"/>
  <text x="608" y="163" font-size="10" fill="#8a929c">Filter...</text>

  <rect x="32" y="176" width="936" height="20" fill="#f0f3f7"/>
  <text x="40" y="190" font-size="10" font-weight="bold" fill="#57606a">Name</text>
  <text x="240" y="190" font-size="10" font-weight="bold" fill="#57606a">Project link</text>
  <text x="420" y="190" font-size="10" font-weight="bold" fill="#57606a">Multiplier</text>
  <text x="510" y="190" font-size="10" font-weight="bold" fill="#57606a">Items</text>
  <text x="580" y="190" font-size="10" font-weight="bold" fill="#57606a">Source</text>
  <text x="680" y="190" font-size="10" font-weight="bold" fill="#57606a">Updated</text>
  <text x="800" y="190" font-size="10" font-weight="bold" fill="#57606a">Open orders</text>

  <g font-size="10" fill="#24292f">
    <rect x="32" y="198" width="936" height="24" fill="#eef4ff"/>
    <text x="40" y="214">PSU Rev C</text><text x="240" y="214">github.com/alex/psu-revc</text><text x="420" y="214">×5</text>
    <text x="510" y="214">38</text><text x="580" y="214">kicad_import</text><text x="680" y="214">2026-08-30</text>
    <rect x="800" y="203" width="60" height="14" rx="7" fill="#fdeadb"/><text x="830" y="213" font-size="9" text-anchor="middle" fill="#8a4b00">1 staged</text>

    <text x="40" y="238">LED Driver v2</text><text x="240" y="238">—</text><text x="420" y="238">×1</text>
    <text x="510" y="238">14</text><text x="580" y="238">manual</text><text x="680" y="238">2026-07-11</text>
    <rect x="800" y="227" width="60" height="14" rx="7" fill="#dbf5e3"/><text x="830" y="237" font-size="9" text-anchor="middle" fill="#186a3a">closed</text>

    <text x="40" y="262">Prototype Sensor Node</text><text x="240" y="262">—</text><text x="420" y="262">×10</text>
    <text x="510" y="262">61</text><text x="580" y="262">csv_import</text><text x="680" y="262">2026-05-02</text>
    <rect x="800" y="251" width="60" height="14" rx="7" fill="#eef2f7"/><text x="830" y="261" font-size="9" text-anchor="middle" fill="#57606a">none</text>
  </g>

  <text x="32" y="300" font-size="9" fill="#8a929c">Row → opens Partlist Editor. "Open orders" chip → jumps to that partlist's order(s) on the Orders tab.</text>
</svg>

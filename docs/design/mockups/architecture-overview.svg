<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4f57"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#f5f6f8"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#24292f">PartManager — System Overview</text>

  <!-- KiCad Schematic/PCB Editor -->
  <rect x="40" y="60" width="260" height="80" rx="8" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text x="170" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#24292f">KiCad Schematic /</text>
  <text x="170" y="113" font-size="14" font-weight="bold" text-anchor="middle" fill="#24292f">PCB Editor</text>

  <!-- KiCad PCB IPC Plugin -->
  <rect x="40" y="180" width="260" height="70" rx="8" fill="#eef2f7" stroke="#c9ccd1" stroke-width="1.5"/>
  <text x="170" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="#24292f">KiCad PCB IPC Plugin</text>
  <text x="170" y="228" font-size="11" text-anchor="middle" fill="#57606a">docked panel, kicad-python</text>

  <!-- Generated KiCad Libraries -->
  <rect x="40" y="290" width="260" height="80" rx="8" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text x="170" y="318" font-size="13" font-weight="bold" text-anchor="middle" fill="#24292f">Generated KiCad Libraries</text>
  <text x="170" y="336" font-size="11" text-anchor="middle" fill="#57606a">.kicad_sym + .pretty + 3d, per category</text>
  <text x="170" y="352" font-size="11" text-anchor="middle" fill="#57606a">(kicad_libs/)</text>

  <!-- PartManager App -->
  <rect x="380" y="170" width="260" height="100" rx="8" fill="#2f6fed" stroke="#1c4fc0" stroke-width="1.5"/>
  <text x="510" y="205" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">PartManager App</text>
  <text x="510" y="225" font-size="11" text-anchor="middle" fill="#dbe6ff">Qt5 Widgets + RibbonWidget</text>
  <text x="510" y="242" font-size="11" text-anchor="middle" fill="#dbe6ff">stock, partlists, orders,</text>
  <text x="510" y="258" font-size="11" text-anchor="middle" fill="#dbe6ff">type templates, library gen</text>

  <!-- SQLite DB + filestore -->
  <rect x="380" y="320" width="260" height="80" rx="8" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text x="510" y="348" font-size="13" font-weight="bold" text-anchor="middle" fill="#24292f">SQLite DB + filestore</text>
  <text x="510" y="366" font-size="11" text-anchor="middle" fill="#57606a">WAL mode, content-hashed files</text>
  <text x="510" y="382" font-size="11" text-anchor="middle" fill="#57606a">(SQLiteWrapper)</text>

  <!-- Mouser API -->
  <rect x="720" y="170" width="240" height="80" rx="8" fill="#ffffff" stroke="#c9ccd1" stroke-width="1.5"/>
  <text x="840" y="198" font-size="13" font-weight="bold" text-anchor="middle" fill="#24292f">Mouser API</text>
  <text x="840" y="216" font-size="11" text-anchor="middle" fill="#57606a">Search API (part data,</text>
  <text x="840" y="232" font-size="11" text-anchor="middle" fill="#57606a">datasheet), Cart API (stage)</text>

  <!-- mouser.com -->
  <rect x="720" y="290" width="240" height="80" rx="8" fill="#fff7ec" stroke="#e8a33d" stroke-width="1.5"/>
  <text x="840" y="318" font-size="13" font-weight="bold" text-anchor="middle" fill="#24292f">mouser.com</text>
  <text x="840" y="336" font-size="11" text-anchor="middle" fill="#57606a">user reviews cart,</text>
  <text x="840" y="352" font-size="11" text-anchor="middle" fill="#57606a">places order manually</text>

  <!-- Arrows -->
  <line x1="380" y1="220" x2="300" y2="220" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="212" font-size="10" text-anchor="middle" fill="#4a4f57">generate</text>

  <line x1="300" y1="330" x2="380" y2="360" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <line x1="170" y1="140" x2="170" y2="180" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="163" font-size="10" text-anchor="middle" fill="#4a4f57">docked in</text>

  <line x1="170" y1="290" x2="170" y2="250" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="272" font-size="10" text-anchor="middle" fill="#4a4f57">sym/fp-lib-table</text>

  <line x1="300" y1="140" x2="510" y2="170" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="440" y="150" font-size="10" text-anchor="middle" fill="#4a4f57">export BOM/netlist file</text>

  <line x1="180" y1="215" x2="380" y2="330" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
  <text x="270" y="290" font-size="10" text-anchor="middle" fill="#4a4f57">shared SQLite (WAL)</text>

  <line x1="510" y1="320" x2="510" y2="270" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="210" x2="720" y2="210" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="200" font-size="10" text-anchor="middle" fill="#4a4f57">search/cart</text>

  <line x1="840" y1="250" x2="840" y2="290" stroke="#4a4f57" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="900" y="272" font-size="10" text-anchor="middle" fill="#4a4f57">cart id</text>

  <rect x="40" y="440" width="920" height="230" rx="8" fill="#ffffff" stroke="#c9ccd1"/>
  <text x="60" y="465" font-size="13" font-weight="bold" fill="#24292f">Legend / key flows</text>
  <text x="60" y="490" font-size="12" fill="#57606a">Solid arrow — generated/derived artifact or direct API call.</text>
  <text x="60" y="510" font-size="12" fill="#57606a">Dashed arrow — file export/import or shared-storage access (no live API dependency).</text>
  <text x="60" y="535" font-size="12" fill="#57606a">1. PartManager generates KiCad libraries from stock → user places parts in schematic the normal KiCad way (Add Symbol),</text>
  <text x="60" y="553" font-size="12" fill="#57606a">   already wired to footprint + 3D model + datasheet. No dependency on KiCad's schematic API (still unofficial in KiCad 10).</text>
  <text x="60" y="576" font-size="12" fill="#57606a">2. BOM/partlist comes back via KiCad's normal file export (works on any KiCad version) — the PCB IPC plugin's live</text>
  <text x="60" y="594" font-size="12" fill="#57606a">   board read is a convenience shortcut, not the primary path.</text>
  <text x="60" y="617" font-size="12" fill="#57606a">3. Mouser Cart API stages the order; the actual purchase confirmation always happens on mouser.com — PartManager</text>
  <text x="60" y="635" font-size="12" fill="#57606a">   never submits a real order or touches payment.</text>
</svg>
